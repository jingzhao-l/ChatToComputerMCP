name: Publish npm (OIDC)

# Register this exact filename as the npm Trusted Publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-stable
  cancel-in-progress: false

jobs:
  package:
    name: Validate tag, source and package
    if: github.repository == 'jingzhao-l/ChatToComputerMCP'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate stable version and main ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags can publish"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "v$version" || { echo "::error::Version/tag mismatch"; exit 1; }
          test "$(node -p "require('./package.json').name")" = chat-to-computer-mcp
          test "$(node -p "require('./package.json').repository.url")" = \
            git+https://github.com/jingzhao-l/ChatToComputerMCP.git
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Publish tag not in main history"; exit 1;
          }
      - name: npm tests and package allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@11
          npm test
          npm pack --ignore-scripts --dry-run --json > npm-pack-manifest.json
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('npm-pack-manifest.json','utf8'));
          const info = Array.isArray(manifest) ? manifest[0] : manifest['chat-to-computer-mcp'];
          if (!info || !Array.isArray(info.files)) throw Error('Invalid npm pack manifest schema');
          const files = new Set(info.files.map(x=>x.path));
          for(const required of [
            'package.json','README.md','README.zh-CN.md',
            'bin/chat-to-computer-mcp.mjs','bin/update-support.mjs',
            'macos/AppUpdates.swift','macos/LaunchAgentService.swift',
            'windows/src/FileMCP.App/DesktopUpdates.cs',
            'macos/ChatToComputerMCPApp.swift',
            'macos/CommandSupervisor.swift','macos/CommandHistoryStore.swift',
            'windows/src/FileMCP.Core/CommandSupervisor.cs',
            'windows/src/FileMCP.Core/TunnelCloudHealth.cs',
            'docs/INDEPENDENT_TASKS.md','docs/PLATFORM_PARITY.md','docs/CUA.md',
            'macos/CUA.swift','windows/src/FileMCP.Core/CuaService.cs','windows/src/FileMCP.Core/CuaGuestHost.cs',
            'bin/cua-support.mjs','bin/cua-extension-support.mjs','cua-runtime/package.json','cua-runtime/package-lock.json','cua-runtime/worker.mjs',
            'windows/src/FileMCP.Core/WorkspaceCommandBudget.cs',
            'vendor/tunnel-client/darwin-arm64/tunnel-client',
            'vendor/tunnel-client/darwin-amd64/tunnel-client','vendor/tunnel-client/darwin-amd64/THIRD-PARTY-LICENSES.txt','vendor/ripgrep/darwin-amd64/rg',
            'docs/PUBLISHING.md','docs/ARCHITECTURE.md','docs/BASE_TOOL_CONTRACT.md','contracts/mcp-tools.json','contracts/desktop-areas.json','LICENSE'
          ]) if(!files.has(required)) throw Error('Missing '+required);
          for(const filename of files)
            if(filename.includes('/obj/') || filename.includes('/bin/Release/') ||
               filename.includes('/bin/Debug/') || filename.endsWith('.npmrc') ||
               filename.endsWith('.pem') || filename.endsWith('.p12') ||
               filename.endsWith('.pfx') || filename.endsWith('/.env'))
              throw Error('Unexpected packed file '+filename);
          console.log('Source package validated: '+info.files.length+' files');
          NODE

  macos:
    name: macOS native quality gate
    needs: package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned native Cua Driver (no input)
        run: node tests/prepare_cua_driver.mjs
      - name: Native CUA security and real Chromium gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test_swift_cua.sh
          npm ci --prefix cua-runtime --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$PWD/cua-runtime/browsers" node cua-runtime/node_modules/playwright/cli.js install --only-shell chromium
          bash tests/test_swift_cua_p4.sh
      - name: Mac UI, workspaces, commands and MCP/HTTP
        shell: bash
        env:
          MCP_HTTP_FUZZ_ITERATIONS: '20'
        run: |
          set -Eeuo pipefail
          python3 tests/check_platform_tool_contracts.py
          bash tests/dump_swift_tool_contract.sh > "$RUNNER_TEMP/mac-contract.json"
          python3 tests/check_base_tool_contract.py "$RUNNER_TEMP/mac-contract.json"
          python3 tests/check_base_tool_docs.py
          bash tests/test_swift_updater.sh
          bash tests/test_swift_ui.sh
          bash tests/test_swift_workspace_scope.sh
          bash tests/test_swift_receipt_ledger.sh
          bash tests/test_swift_agent_tools.sh
          bash tests/test_swift_runtime.sh
          python3 tests/test_tunnel_transport_recovery.py
          bash build_macos_app.sh
          codesign --verify --deep --strict dist/ChatToComputerMCP.app
          test -x dist/ChatToComputerMCP.app/Contents/MacOS/ChatToComputerMCP

  macos-intel:
    needs: package
    name: macOS Intel gateway, CUA and installer
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Intel vendor, source installer and native coding tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = x86_64
          bash tests/check_intel_vendor.sh
          npm test
          CTCMCP_REAL_CUA_DRIVER="$(node tests/prepare_cua_driver.mjs)"
          test -x "$CTCMCP_REAL_CUA_DRIVER"
          export CTCMCP_REAL_CUA_DRIVER
          bash tests/test_swift_cua.sh
          bash tests/test_swift_agent_tools.sh
          MCP_HTTP_FUZZ_ITERATIONS=20 bash tests/test_swift_runtime.sh
          bash build_macos_app.sh
          codesign --verify --deep --strict dist/ChatToComputerMCP.app
          file dist/ChatToComputerMCP.app/Contents/MacOS/ChatToComputerMCP | grep -q x86_64
          cmp vendor/tunnel-client/darwin-amd64/THIRD-PARTY-LICENSES.txt dist/ChatToComputerMCP.app/Contents/Resources/tunnel-client-THIRD-PARTY-LICENSES.txt
          # Intel vendor binaries may need local signing in the bundle; the
          # checked-in source hashes must remain unchanged.
          bash tests/check_intel_vendor.sh
          dist/ChatToComputerMCP.app/Contents/MacOS/rg --version | grep -q '^ripgrep 15.2.0 '
          dist/ChatToComputerMCP.app/Contents/MacOS/tunnel-client --version | grep -q '^0.0.12+881c9a8fed7cccbe6607cd419863bbca506b8215 '

  windows:
    name: Windows native quality gate
    needs: package
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Windows updater CLI tests
        shell: pwsh
        run: npm test

      - name: Prepare pinned native Cua Driver (no input)
        run: node tests/prepare_cua_driver.mjs
      - name: Windows build, integration, release and GUI
        shell: pwsh
        env:
          MCP_HTTP_FUZZ_ITERATIONS: '20'
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build windows/FileMCP.Windows.sln -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          dotnet run --no-build -c Release --project windows/tests/FileMCP.Core.Tests -- --dump-base-tool-contract | Out-File -Encoding utf8 "$env:RUNNER_TEMP/win-contract.json"
          if ($LASTEXITCODE -ne 0) { throw "Windows contract export failed" }
          python tests/check_base_tool_contract.py "$env:RUNNER_TEMP/win-contract.json"
          if ($LASTEXITCODE -ne 0) { throw "Windows contract drift" }
          ./tests/test_windows_runtime.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime tests failed" }
          ./build_windows_app.ps1 -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed" }
          ./tests/test_windows_app.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows GUI smoke failed" }
          ./tests/test_windows_npm_install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows clean npm installation failed" }

      - name: Real Chromium and optional Guest gateway
        shell: pwsh
        run: |
          npm ci --prefix cua-runtime --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Playwright install failed" }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'cua-runtime/browsers'
          node cua-runtime/node_modules/playwright/cli.js install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium install failed" }
          $env:CTCMCP_CUA_TEST_SERVER = (Resolve-Path 'windows/tests/FileMCP.Core.Tests/bin/Release/net8.0-windows/FileMCP.Core.Tests.exe').Path
          node tests/test_cua_p4.mjs
          if ($LASTEXITCODE -ne 0) { throw "CUA integration failed" }

  windows-arm64:
    needs: package
    name: Windows ARM64 native runtime, CUA and installer
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      MCP_HTTP_FUZZ_ITERATIONS: "20"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false
      - name: Require native architecture and pinned vendors
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne "Arm64") { throw "ARM64 OS required" }
          if ((node -p "process.arch").Trim() -ne "arm64") { throw "Native ARM64 Node required" }
          $info = dotnet --info | Out-String
          if ($info -notmatch '(?im)^\s*Architecture:\s*arm64\s*$') { throw "Native ARM64 .NET required" }
          if ((Get-FileHash vendor/tunnel-client/windows-arm64/tunnel-client.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "480684ec1031fc2985c7e87f9d669e7dfda4012a8ecdab21eabe1b5deafdd656") { throw "ARM64 tunnel-client checksum mismatch" }
          if ((Get-FileHash vendor/ripgrep/windows-arm64/rg.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne "d33a29a9ef03c9f4c03be9e8d88498e6e2d2e566d64cdbdef97f9afc8f13120c") { throw "ARM64 ripgrep checksum mismatch" }
          if ((& vendor/tunnel-client/windows-arm64/tunnel-client.exe --version) -notmatch '^0\.0\.12\+881c9a8fed7cccbe6607cd419863bbca506b8215 ') { throw "Unexpected ARM64 tunnel-client version" }
          if ((& vendor/ripgrep/windows-arm64/rg.exe --version | Select-Object -First 1) -notmatch '^ripgrep 15\.2\.0 ') { throw "Unexpected ARM64 ripgrep version" }
      - name: Prepare pinned native Cua Driver (no input)
        run: node tests/prepare_cua_driver.mjs
      - name: Build and test base gateway
        shell: pwsh
        run: |
          dotnet build windows/FileMCP.Windows.sln -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "ARM64 build failed" }
          ./tests/test_windows_runtime.ps1 -BaseOnly
          dotnet run --no-build -c Release --project windows/tests/FileMCP.Core.Tests -- --dump-base-tool-contract | Out-File -Encoding utf8 "$env:RUNNER_TEMP/win-arm64-contract.json"
          if ($LASTEXITCODE -ne 0) { throw "ARM64 contract export failed" }
          python tests/check_base_tool_contract.py "$env:RUNNER_TEMP/win-arm64-contract.json"
          if ($LASTEXITCODE -ne 0) { throw "ARM64 contract drift" }
      - name: Native app and source package installer
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "ARM64 npm tests failed" }
          ./build_windows_app.ps1 -Architecture arm64
          ./tests/test_windows_app.ps1
          ./tests/test_windows_npm_install.ps1

  publish:
    name: Publish using npm Trusted Publisher
    needs: [package, macos, macos-intel, windows, windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use OIDC-capable npm
        run: npm install --global npm@11
      - name: Refuse stale stable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          npm view chat-to-computer-mcp dist-tags.latest --json --prefer-online --fetch-retries=0 > "$RUNNER_TEMP/latest.json"
          node tests/check_release_order.mjs "$RUNNER_TEMP/latest.json"
      - name: Refuse immutable version reuse
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "chat-to-computer-mcp@$version" version --json >/dev/null 2>&1; then
            echo "::error::Version already exists on npm"; exit 1
          fi
      - name: Publish without long-lived npm token
        run: npm publish --access public --tag latest --ignore-scripts
      - name: Verify registry read-back
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          # npm can acknowledge the OIDC publish before publish-time malware
          # scanning makes a new version visible. This is NOT a reason to
          # re-publish an immutable version or force-push the tag.
          for retry in $(seq 1 90); do
            found="$(
              npm view "chat-to-computer-mcp@$version" version --prefer-online                 --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true
            )"
            latest="$(
              npm view chat-to-computer-mcp dist-tags.latest --prefer-online                 --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true
            )"
            if [ "$found" = "$version" ] && [ "$latest" = "$version" ]; then
              echo "Verified npm Registry: chat-to-computer-mcp@$version is latest"
              exit 0
            fi
            if [ $((retry % 6)) -eq 0 ]; then
              echo "Published tarball accepted; Registry still processing version $version ($retry checks)."
            fi
            sleep 8
          done
          echo "::error::npm accepted the upload, but the version/latest dist-tag did not become public within the verification window. Check Registry and publish-time scanning; do NOT re-publish or reuse the immutable version."
          exit 1

  github-release:
    name: Publish GitHub release after registry verification
    needs: publish
    if: github.repository == 'jingzhao-l/ChatToComputerMCP'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish verified source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          latest="$(npm view chat-to-computer-mcp dist-tags.latest --prefer-online --fetch-retries=0)"
          test "$latest" = "$version" || { echo "::error::npm latest changed; refusing to mark an older GitHub release latest"; exit 1; }
          python3 - "$version" <<'PY'
          import sys
          from pathlib import Path
          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith("## [" + version + "]"))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit("Missing release notes")
          Path("release-notes.md").write_text(notes + "\n\nInstall: `npx --yes chat-to-computer-mcp@" + version + " install`\n\nNative source builds; CUA permissions and Guest opt-in remain local.\n")
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || { echo "Release already published; refusing replacement"; exit 1; }
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "ChatToComputerMCP $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "ChatToComputerMCP $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$actual" = "$GITHUB_REF_NAME" || { echo "::error::GitHub latest release read-back mismatch"; exit 1; }
